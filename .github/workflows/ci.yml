name: Educational retrieval checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m maternity_copilot train
      - name: Inspect and round-trip deterministic synthetic artifacts
        run: |
          python -m maternity_copilot inspect
          python -m maternity_copilot evaluate --split held_out --k 3 --output models/report.json
          python -m maternity_copilot compare --before models/report.json --after models/report.json --fail-on-regression recall_at_k ndcg_at_k --per-case
          python -m maternity_copilot plan --stage pregnancy --question access-guide:1 --output models/questions.json
          python -m maternity_copilot plan-read --input models/questions.json --text
