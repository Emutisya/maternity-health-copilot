[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maternity-health-copilot"
version = "0.1.0"
description = "Synthetic educational resource retrieval and appointment question planning"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
maternity-copilot = "maternity_copilot.__main__:main"

[tool.setuptools.packages.find]
include = ["maternity_copilot*"]

[tool.setuptools.package-data]
maternity_copilot = ["data/*.json", "dashboard.html"]
